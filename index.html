<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chrome Dino Game</title>
    <meta name="description" content="A remake of the Chrome offline T-Rex game in vanilla JavaScript: running, ducking, pterodactyls, night mode, sounds and touch support.">
    <meta name="theme-color" content="#f7f7f7">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <main class="game-container">
        <canvas id="game" width="600" height="150" aria-label="لعبة الديناصور. اضغط مسافة للقفز والسهم لأسفل للتوطية."></canvas>

        <p class="hint">
            <span class="desktop-only"><kbd>Space</kbd> أو <kbd>↑</kbd> للبدء والقفز · <kbd>↓</kbd> للتوطية</span>
            <span class="touch-only">المس الملعب للقفز · المس الجزء السفلي للتوطية</span>
        </p>
    </main>

    <div class="floating-buttons">
        <button id="soundToggleBtn" class="floating-btn" title="الصوت" aria-label="تشغيل أو كتم الصوت">🔊</button>
        <button id="themeToggleBtn" class="floating-btn" title="تغيير الثيم" aria-label="تغيير الثيم">🌙</button>
    </div>

    <script src="sprites.js"></script>
    <script src="script.js"></script>
</body>
</html>
